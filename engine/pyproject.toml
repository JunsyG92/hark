[project]
name = "hark-engine"
version = "0.1.0"
description = "Hark local engine: storage, local API, audio detection, transcription, analysis."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "keyring>=25",
  "platformdirs>=4",
  "pyyaml>=6",
]

[project.scripts]
hark-engine = "hark_engine.main:main"
hark-contracts = "hark_engine.contracts:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7", "mypy>=1.13", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hark_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["hark_engine"]
mypy_path = "src"
