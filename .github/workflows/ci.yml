name: CI
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: cd engine && uv sync
      - run: scripts/check.sh
      - name: Electron smoke test
        if: runner.os == 'Linux'
        run: pnpm --filter @hark/app build && xvfb-run -a -s "-screen 0 1600x1000x24" pnpm --filter @hark/app e2e
      - name: Local-first network audit (no outbound connection)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y strace && scripts/audit-network.sh
